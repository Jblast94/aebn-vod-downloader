services:
  aebndl-web:
    build:
      context: .
    image: aebndl-web:local
    container_name: aebndl-web
    restart: unless-stopped
    labels:
      - "docktail.service.enable=true"
      - "docktail.service.name=aebn-dl"
      - "docktail.service.port=8787"
      - "docktail.service.service-protocol=http"
    ports:
      - "${AEBNDL_WEB_PORT:-8787}:8787"
    environment:
      AEBNDL_HOST: 0.0.0.0
      AEBNDL_PORT: 8787
      AEBNDL_OUTPUT_DIR: /downloads
      AEBNDL_WORK_DIR: /work
      AEBNDL_DB_PATH: "${AEBNDL_DB_PATH:-/downloads/aebndl-jobs.db}"
      AEBNDL_MAX_CONCURRENT_JOBS: "${AEBNDL_MAX_CONCURRENT_JOBS:-1}"
      AEBNDL_JOB_RETENTION_HOURS: "${AEBNDL_JOB_RETENTION_HOURS:-0}"
      AEBNDL_RUNPOD_ENDPOINT_URL: "${AEBNDL_RUNPOD_ENDPOINT_URL:-https://api.runpod.ai/v2/bfarkaz0uwuhcn}"
      AEBNDL_RUNPOD_AUDIO_FIELD: "${AEBNDL_RUNPOD_AUDIO_FIELD:-audio_base64}"
      AEBNDL_RUNPOD_UPLOAD_TIMEOUT: "${AEBNDL_RUNPOD_UPLOAD_TIMEOUT:-600}"
      AEBNDL_SUBTITLE_CHUNK_MINUTES: "${AEBNDL_SUBTITLE_CHUNK_MINUTES:-10}"
      AEBNDL_SUBTITLE_MAX_CHUNK_MB: "${AEBNDL_SUBTITLE_MAX_CHUNK_MB:-50}"
      AEBNDL_AUTO_SUBTITLES: "${AEBNDL_AUTO_SUBTITLES:-true}"
      AEBNDL_SUBTITLE_LANGUAGE: "${AEBNDL_SUBTITLE_LANGUAGE:-}"
      RUNPOD_API_KEY: "${RUNPOD_API_KEY:-}"
      TZ: "${TZ:-UTC}"
    volumes:
      # Point this at your remote-mounted download location, for example /mnt/nas/aebn-downloads.
      - "${AEBNDL_REMOTE_DOWNLOAD_DIR:-./downloads}:/downloads"
      # Keep temporary segments separate; this can also be a remote mount if desired.
      - "${AEBNDL_REMOTE_WORK_DIR:-./work}:/work"
