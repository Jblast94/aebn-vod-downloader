# MVP: one local web UI + downloader. No extra workers, no cloud APIs.
# Bind media to a directory on this VM (default ./downloads). NFS is not required.
services:
  aebndl-web:
    build:
      context: .
    image: aebndl-web:local
    container_name: aebndl-web
    restart: unless-stopped
    labels:
      - "docktail.service.enable=true"
      - "docktail.service.name=aebn-dl"
      - "docktail.service.port=8787"
      - "docktail.service.service-protocol=https"
    ports:
      - "${AEBNDL_WEB_PORT:-8787}:8787"
    environment:
      AEBNDL_HOST: 0.0.0.0
      AEBNDL_PORT: 8787
      AEBNDL_OUTPUT_DIR: /downloads
      AEBNDL_WORK_DIR: /work
      AEBNDL_DB_PATH: "${AEBNDL_DB_PATH:-/downloads/aebndl-jobs.db}"
      AEBNDL_MAX_CONCURRENT_JOBS: "${AEBNDL_MAX_CONCURRENT_JOBS:-1}"
      AEBNDL_JOB_RETENTION_HOURS: "${AEBNDL_JOB_RETENTION_HOURS:-0}"
      AEBNDL_AUTO_SUBTITLES: "false"
      TZ: "${TZ:-UTC}"
    volumes:
      - "${AEBNDL_DOWNLOAD_DIR:-./downloads}:/downloads"
      - "${AEBNDL_SEGMENT_DIR:-./work}:/work"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8787/health')",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
